<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng thí nghiệm Vật lí</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="bar">
  <button id="btn-home" class="btn" type="button" aria-label="Về thư viện bài học">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
    <span>Thư viện</span>
  </button>
  <nav id="crumb" aria-label="Vị trí bài học"></nav>
  <div id="tabs" role="tablist" aria-label="Các mô phỏng trong chương"></div>
  <div class="tools">
    <button id="btn-theme" class="btn icon" type="button" aria-label="Đổi nền sáng/tối">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
    <button id="btn-help" class="btn icon" type="button" aria-label="Phím và cử chỉ (F1)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17.5h.01"/></svg>
    </button>
  </div>
</header>
<canvas id="stage"></canvas>
<main id="home" hidden></main>
<video id="cam" playsinline muted hidden></video>
<div id="notice" hidden></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
